version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gaming_arena_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: arena_user
      POSTGRES_PASSWORD: arena_password
      POSTGRES_DB: arena_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_user -d arena_db"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks:
      - arena_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaming_arena_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://arena_user:arena_password@db:5432/arena_db?schema=public"
      JWT_SECRET: "gaming_arena_super_secret_jwt_key_2026"
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - arena_network

volumes:
  pgdata:
    driver: local

networks:
  arena_network:
    driver: bridge
